<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candle City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* One night-time world, single theme by choice. Layout: full-screen stage with a top bar, a transport deck and overlay panels. */
  --night:#0a0b2e; --panel:#0e1040; --panel-2:#151852; --line:#2b2f77; --text:#e8eaff; --muted:#a3a8de;
  --gold:#ffc24b; --up:#3df2a4; --down:#ff4d6d; --violet:#8f78ff; --cyan:#59d8ff;
  --display:"Chakra Petch","Trebuchet MS",sans-serif; --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--text);font:14px/1.45 var(--body);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .gold{color:var(--gold)} .muted{color:var(--muted)}
h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.02em}
h2{font-size:18px} h3{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
#app{height:100%;display:flex;flex-direction:column}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.mark{width:10px;height:22px;background:var(--up);box-shadow:0 0 12px var(--up);position:relative;flex:none}
.mark:before{content:"";position:absolute;left:4px;top:-5px;width:2px;height:32px;background:var(--up)}
#cityName{font:700 19px var(--display);letter-spacing:.06em;text-transform:uppercase;background:transparent;border:1px dashed transparent;border-radius:4px;width:16ch;max-width:46vw;padding:2px 4px}
#cityName:hover,#cityName:focus{border-color:var(--line)}
.top nav{display:flex;gap:4px}
.top nav a{font:600 13px var(--display);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:6px;border:1px solid transparent}
.top nav a[aria-current="page"]{color:var(--night);background:var(--gold)}
.top nav a:hover:not([aria-current]){border-color:var(--line);color:var(--text)}
.status{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{font:600 11px var(--display);letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.sim{border-color:var(--gold);color:var(--gold)}
.pill.live{border-color:var(--down);color:var(--down)}
#err{position:absolute;left:12px;bottom:12px;background:rgba(5,6,28,.9);border:1px solid var(--down);border-radius:8px;padding:6px 10px;font-size:12px;max-width:calc(100% - 24px)}
.brand b{font:700 19px var(--display);letter-spacing:.06em;text-transform:uppercase}
.days button{width:26px;cursor:default}
#clock{font-family:var(--mono);font-size:12px;color:var(--muted)}
#dayNet{font:600 15px var(--mono)}

.view{flex:1;min-height:0;display:none}
.view.on{display:flex}
/* city */
#v-city{flex-direction:column}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:linear-gradient(#0a0b2e,#1a1470)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform}
.lbl-tower,.lbl-vault{pointer-events:auto;background:rgba(5,6,28,.86);border:1px solid var(--line);border-radius:6px;padding:4px 8px;text-align:center;font:500 11px/1.35 var(--mono)}
.lbl-tower b,.lbl-vault b{display:block;font:700 12px var(--display);letter-spacing:.06em}
.lbl-tower.call{border-color:var(--up)} .lbl-tower.put{border-color:var(--down)} .lbl-tower.off{border-color:var(--gold)}
.lbl-vault{border-color:var(--gold);padding:5px 12px}
.lbl-vault b{color:var(--gold);font-size:10px;letter-spacing:.14em}
.lbl-vault .big{font:600 17px var(--mono);display:block}
.toast{font:700 12px var(--display);letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:99px;background:rgba(5,6,28,.9);border:1.5px solid currentColor;text-shadow:0 0 8px currentColor}
.toast.cyan{color:var(--cyan)}
.hud{position:absolute;left:12px;top:12px;display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100% - 24px)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:rgba(5,6,28,.8)}
.seg button{background:none;border:0;padding:6px 10px;font:600 12px var(--display);letter-spacing:.06em;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--violet);color:#08082a}
.btn{background:rgba(5,6,28,.8);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:600 12px var(--display);letter-spacing:.06em}
.btn:hover{border-color:var(--text)} .btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#1b1300}
.btn.danger{border-color:var(--down);color:var(--down)}
#nogl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}

.side{position:absolute;right:12px;top:12px;bottom:12px;width:min(420px,calc(100% - 24px));background:rgba(10,11,46,.94);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;backdrop-filter:blur(6px)}
.side header{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.side header .x{margin-left:auto}
.side .body{overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.x{background:none;border:1px solid var(--line);border-radius:6px;width:28px;height:28px;line-height:1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{background:var(--panel-2);border-radius:8px;padding:6px 8px}
.stat span{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat b{font:600 14px var(--mono)}
.desk{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:end}
.scanner{background:#05061c;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:12px/1.5 var(--mono)}
.scanner .hd{display:flex;justify-content:space-between;gap:8px;font:700 12px var(--display);letter-spacing:.08em;color:var(--gold)}
.scanner .hd small{font:500 10px var(--mono);color:var(--muted);letter-spacing:0;text-align:right}
.scanner .now{margin:6px 0;padding:4px 8px;border:1px solid var(--line);border-radius:4px;font-weight:600}
.scanner .now.call{border-color:var(--up);color:var(--up)} .scanner .now.put{border-color:var(--down);color:var(--down)} .scanner .now.off{border-color:var(--gold);color:var(--gold)}
.bar{height:8px;background:var(--panel-2);border-radius:4px;overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;background:var(--up);border-radius:4px}
.thoughts{list-style:none;margin:6px 0 0;padding:0;color:var(--muted);min-height:108px}
.thoughts li{display:flex;gap:8px} .thoughts time{color:var(--violet);flex:none}
.thoughts .fire{color:var(--text);font-weight:600}
canvas.chart{width:100%;height:170px;display:block;background:#05061c;border:1px solid var(--line);border-radius:8px}
.legend{display:flex;gap:12px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:4px}
.trades{display:flex;flex-direction:column;gap:6px}
.trade{background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:8px}
.trade.win{border-left-color:var(--up)} .trade.loss{border-left-color:var(--down)} .trade.open{border-left-color:var(--gold)}
.trade summary{display:flex;gap:8px;align-items:baseline;padding:6px 10px;cursor:pointer;list-style:none;font-size:12px}
.trade summary::-webkit-details-marker{display:none}
.trade summary b{font-family:var(--mono);margin-left:auto}
.trade dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;padding:2px 10px 8px;font:12px var(--mono)}
.trade dt{color:var(--muted)} .trade dd{margin:0;text-align:right}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font:600 10px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right;padding:4px 6px}
td{padding:5px 6px;border-top:1px solid var(--line);text-align:right;font-family:var(--mono)}
th:first-child,td:first-child{text-align:left;font-family:var(--body)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tile{border-radius:8px;padding:10px 6px;text-align:center;font:600 12px var(--mono);color:#04121c}
.tile small{display:block;font:700 11px var(--display);letter-spacing:.06em}

/* deck */
.deck{background:var(--panel);border-top:1px solid var(--line);padding:8px 16px;display:flex;flex-direction:column;gap:6px}
.transport{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.transport input[type=range]{flex:1;min-width:120px;accent-color:var(--gold)}
.days{display:flex;gap:3px}
.days button{width:22px;height:22px;border-radius:4px;border:1px solid var(--line);background:var(--panel-2);font:600 10px var(--mono);padding:0;color:var(--muted)}
.days button.g{background:rgba(61,242,164,.25);color:var(--up)} .days button.r{background:rgba(255,77,109,.25);color:var(--down)}
.days button[aria-current="true"]{border-color:var(--gold);color:var(--gold)}
.tape{display:flex;gap:18px;overflow:hidden;white-space:nowrap;font:12px var(--mono);color:var(--muted);min-height:18px}
.tape span b{color:var(--text);font-weight:500}

/* recap */
.modal{position:absolute;inset:0;background:rgba(5,6,28,.78);display:grid;place-items:center;padding:16px;z-index:5}
.modal[hidden]{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(560px,100%);max-height:100%;overflow:auto;text-align:center;display:flex;flex-direction:column;gap:12px}
.card .eyebrow{font:600 12px var(--display);letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.card .total{font:600 44px/1 var(--mono);text-shadow:0 0 24px currentColor}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:16px;border-bottom:1px solid var(--line);position:relative}
.bars .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative;min-width:0}
.bars .col i{width:100%;border-radius:4px 4px 0 0;min-height:2px}
.bars .col span{font:10px var(--mono);color:var(--muted);position:absolute;bottom:-18px;white-space:nowrap}
.bars .col em{font:600 10px var(--mono);font-style:normal;margin-bottom:2px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* compound + risk desk: scrolling pages */
.page{flex-direction:column;overflow:auto;padding:16px;gap:16px}
.grid{display:grid;gap:16px;grid-template-columns:minmax(260px,340px) 1fr;align-items:start}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.box>header{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
#station{width:100%;height:132px;display:block;image-rendering:pixelated;border-radius:8px;border:1px solid var(--line);background:#05061c}
.crew{display:flex;flex-direction:column;gap:4px;list-style:none;margin:0;padding:0}
.crew button{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--panel-2);border:1px solid transparent;border-radius:8px;padding:6px 10px}
.crew button[aria-pressed="true"]{border-color:var(--gold)}
.crew img,.sprite{width:30px;height:42px;image-rendering:pixelated}
.crew .nm{font:700 13px var(--display);letter-spacing:.06em;text-transform:uppercase}
.crew .st{font-size:11px;color:var(--muted)} .crew .st.w{color:var(--up)} .crew .st.l{color:var(--gold)}
.crew .lv{font:600 12px var(--mono);color:var(--muted);text-align:right}
.xp{height:3px;background:var(--line);border-radius:2px;margin-top:4px;grid-column:1/-1}.xp i{display:block;height:100%;background:var(--gold);border-radius:2px}
.report{font:13px/1.6 var(--mono);background:#05061c;border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.ask{display:flex;gap:8px} .ask input{flex:1;min-width:0}
input[type=text],input[type=number],select{background:#05061c;border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{background:none;border:1px solid var(--line);border-radius:99px;padding:3px 10px;font:600 11px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:#08082a}
.classes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.classes button{text-align:left;background:var(--panel-2);border:1px solid transparent;border-radius:8px;padding:8px 10px}
.classes button[aria-pressed="true"]{border-color:var(--gold)}
.classes b{display:block;font:700 13px var(--display);letter-spacing:.06em;text-transform:uppercase}
.classes span{font-size:12px;color:var(--muted)}
.looks{display:flex;gap:4px;flex-wrap:wrap}
.looks button{background:var(--panel-2);border:1px solid transparent;border-radius:6px;padding:3px}
.looks button[aria-pressed="true"]{border-color:var(--gold)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.form input{width:100%}
.conns{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.conn{background:var(--panel-2);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:4px}
.conn b{font:700 13px var(--display);letter-spacing:.04em}
.conn span{font-size:12px;color:var(--muted)}
.score{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.score .stat b{font-size:17px}
.audit{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;max-width:75ch}
.audit b{color:var(--gold);font-weight:600}
.note{font-size:12px;color:var(--muted);max-width:75ch;margin:0}
canvas.curve{width:100%;height:150px;display:block;background:#05061c;border:1px solid var(--line);border-radius:8px}
.hours{display:flex;gap:6px;align-items:flex-end;height:90px;margin-bottom:18px}
.scroll-x{overflow-x:auto}

@media (max-width:760px){
  .grid{grid-template-columns:1fr}
  .side{left:8px;right:8px;top:auto;bottom:8px;width:auto;height:64%}
  .status #clock{display:none}
  .lbl-tower{font-size:10px;padding:3px 6px}
  .lbl-tower .s{display:none}
  .card .total{font-size:34px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"></span><b>Candle City</b></div>
    <nav aria-label="Pages"><a href="./" aria-current="page">City</a><a href="../">Wick page</a></nav>
    <div class="status"><span id="mode" class="pill sim">Paper account</span><span id="clock">Loading…</span><span id="dayNet" class="num"></span></div>
  </header>
  <section id="v-city" class="view on">
    <div class="stage">
      <canvas id="gl" aria-label="3D city. Each tower is one of the bot's two strategies."></canvas>
      <div id="labels"></div>
      <div id="nogl" hidden>The 3D city needs WebGL, which this browser has turned off. The Wick page shows the same account.</div>
      <div class="hud">
        <div class="seg" role="group" aria-label="Camera"><button id="camFly" type="button" aria-pressed="true">Fly</button><button id="camOrbit" type="button" aria-pressed="false">Hold still</button></div>
        <button id="payrollBtn" class="btn" type="button">Payroll</button>
      </div>
      <aside id="side" class="side" hidden></aside>
      <div id="err" role="status" hidden></div>
    </div>
    <footer class="deck">
      <div class="transport"><span class="muted" style="font-size:12px">Account by day</span><div id="days" class="days"></div></div>
      <div id="tape" class="tape"></div>
    </footer>
  </section>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* ===== City: the 3D scene. Exposes City.init(canvas, labelsEl, hooks) and a small API the UI drives. ===== */
var City = (function () {
  var T = window.THREE, scene, cam, renderer, controls, clock, towers = [], vault, waves = [], coins = [], walls = [], traffic, lights = [], labelsEl, hooks, toasts = [], reduce = false, ok = false;
  var COL = { up: 0x3df2a4, down: 0xff4d6d, gold: 0xffc24b, violet: 0x7a5cff, cyan: 0x59d8ff, white: 0xe8eaff };
  var TOWER_POS = [[2, -8], [-11, -3]], VAULT_POS = [-3, 13];

  function tex(w, h, draw) { var c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); var t = new T.CanvasTexture(c); t.canvas = c; return t; }
  function windowTex(seed, tint) {
    return tex(64, 128, function (g, w, h) {
      g.fillStyle = '#070824'; g.fillRect(0, 0, w, h); var s = seed;
      for (var y = 3; y < h - 3; y += 6) for (var x = 3; x < w - 3; x += 6) {
        s = (s * 9301 + 49297) % 233280; var r = s / 233280;
        if (r < 0.52) { g.fillStyle = r < 0.06 ? '#ffc24b' : (r < 0.3 ? tint : '#e8eaff'); g.globalAlpha = 0.45 + r; g.fillRect(x, y, 3, 3); }
      }
      g.globalAlpha = 1;
    });
  }
  function basic(color, o) { var m = new T.MeshBasicMaterial(Object.assign({ color: color }, o || {})); return m; }
  function glow(color, opacity) { return basic(color, { transparent: true, opacity: opacity, blending: T.AdditiveBlending, depthWrite: false, side: T.DoubleSide }); }
  function ring(r0, r1, color, op) { var m = new T.Mesh(new T.RingGeometry(r0, r1, 96), glow(color, op)); m.rotation.x = -Math.PI / 2; return m; }

  function buildGround() {
    var g = new T.Mesh(new T.PlaneGeometry(900, 900), basic(0x0c1048)); g.rotation.x = -Math.PI / 2; g.position.y = -0.05; scene.add(g);
    var grid = new T.GridHelper(900, 150, 0x2a35c9, 0x1a2190); grid.material.transparent = true; grid.material.opacity = 0.35; scene.add(grid);
    var plaza = new T.Mesh(new T.CircleGeometry(27, 96), basic(0x10145e)); plaza.rotation.x = -Math.PI / 2; plaza.position.y = 0.01; scene.add(plaza);
    [[26.4, 27, COL.white, 0.9], [22.5, 22.7, COL.violet, 0.8], [29.5, 29.7, COL.violet, 0.5]].forEach(function (a, i) { var r = ring(a[0], a[1], a[2], a[3]); r.position.y = 0.03 + i * 0.01; scene.add(r); });
    for (var i = 0; i < 40; i++) { // fence posts and lamps on the outer ring
      var a = i / 40 * Math.PI * 2, p = new T.Mesh(new T.BoxGeometry(0.12, 1.1, 0.12), basic(i % 4 ? 0x3a2fb0 : COL.white)); p.position.set(Math.cos(a) * 27, 0.55, Math.sin(a) * 27); scene.add(p);
    }
    TOWER_POS.forEach(function (tp) { // roads from each tower to the vault
      var dx = VAULT_POS[0] - tp[0], dz = VAULT_POS[1] - tp[1], len = Math.sqrt(dx * dx + dz * dz);
      var road = new T.Mesh(new T.PlaneGeometry(0.5, len), glow(COL.violet, 0.45)); road.rotation.x = -Math.PI / 2; road.rotation.z = Math.atan2(dx, dz); road.position.set(tp[0] + dx / 2, 0.04, tp[1] + dz / 2); scene.add(road);
    });
  }

  function buildSkyline() {
    var geo = new T.BoxGeometry(1, 1, 1); geo.translate(0, 0.5, 0);
    var tints = ['#7a5cff', '#59d8ff', '#b9a8ff'], dummy = new T.Object3D(), s = 12345;
    function rnd() { s = (s * 9301 + 49297) % 233280; return s / 233280; }
    for (var k = 0; k < 3; k++) {
      var t = windowTex(11 + k * 7, tints[k]); t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(1, 1 + k);
      var n = 190, im = new T.InstancedMesh(geo, basic(0xffffff, { map: t }), n);
