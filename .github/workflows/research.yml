name: research

# Run by hand: Actions -> research -> Run workflow. Tests daily, intraday and machine-learning
# strategies (research/strategy_lab.py) and commits the results to research/results/.
on:
  workflow_dispatch:
    inputs:
      script:
        description: research script to run
        default: strategy_lab
        type: choice
        options: [strategy_lab, self_tune, intraday_lab, learn_check]

permissions:
  contents: write

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt scikit-learn
      - name: Run research script
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: python research/${{ inputs.script || 'strategy_lab' }}.py | tee research/results/${{ inputs.script || 'strategy_lab' }}_log.txt
      - name: Save results
        run: |
          git config user.name "wick-bot"
          git config user.email "wick-bot@users.noreply.github.com"
          git add research/results
          git diff --cached --quiet || git commit -m "research results: ${{ inputs.script || 'strategy_lab' }}"
          git pull --rebase --quiet && git push --quiet
